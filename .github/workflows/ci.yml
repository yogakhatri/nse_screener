name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate config
        run: make check-config CI=true

      - name: Compile Python files
        run: make check CI=true

      - name: Run tests
        run: make test CI=true

      - name: Demo run (fixture)
        run: make demo-run CI=true
