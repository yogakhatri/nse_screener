[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-screener"
version = "0.2.0"
description = "Long-term NSE equity research engine with peer-relative scoring and Top 3 shortlists"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.28",
    "lxml>=4.9",
    "streamlit>=1.28",
    "plotly>=5.15",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
ml = ["scipy>=1.11", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = []

[project.scripts]
nse-run = "scripts.run_engine:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
